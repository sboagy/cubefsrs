name = "cubefsrs-sync-worker"
main = "src/index.ts"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 8797

# Hyperdrive Binding (PostgreSQL Connection Pooling)
# Manages connection pooling to prevent "too many connections" errors
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "e7f5143597204a649319d5312b3355f3"
localConnectionString = "postgresql://postgres:postgres@127.0.0.1:54322/postgres"

# --- STAGING SETTINGS (Overrides) ---
[env.staging]
name = "cubefsrs-sync-worker-staging"

[[env.staging.hyperdrive]]
binding = "HYPERDRIVE"
id = "9514b1eccf354ebcb33d7ca490d5cbde"

[env.staging.vars]
# The deploy script overrides this with the real staging URL from
# .env.staging.template via `wrangler deploy --var SUPABASE_URL:$SUPABASE_URL`.
# Keep this explicit non-production placeholder so env.staging never inherits
# the top-level production SUPABASE_URL on direct/manual Wrangler invocation.
SUPABASE_URL = "https://staging-supabase-url.invalid"
SYNC_DIAGNOSTICS = "true"

[vars]
# Production worker runtime config. Keep this aligned with the production
# Supabase project used by the app build env.
SUPABASE_URL = "https://pjxuonglsvouttihjven.supabase.co"
# SUPABASE_URL = "http://127.0.0.1:54321"
# SUPABASE_JWT_SECRET should be set via `wrangler secret put SUPABASE_JWT_SECRET`

# Optional: Enable worker debug logging (console.log statements)
# Set to "true" to enable verbose logging for development/debugging
# WORKER_DEBUG = "true"

# Optional: sync diagnostics (debug only)
SYNC_DIAGNOSTICS = "true"

[observability]
enabled = true
